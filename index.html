<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ヒトデゲームセンター</title>
<style>
  body { margin:0; font-family: sans-serif; background:#070a1a; color:#eef; text-align:center; }
  header { padding:48px 16px 8px; }
  h1 { font-size:2rem; margin:0 0 8px; }
  .sub { color:#9ab; margin:0 0 32px; }
  .card { display:block; max-width:420px; margin:0 auto 24px; padding:24px 20px; background:#101736;
          border:1px solid #2a3a6e; border-radius:16px; color:#eef; text-decoration:none; }
  .card:active, .card:hover { background:#16204a; }
  .card .title { font-size:1.4rem; margin-bottom:8px; }
  .card .desc { color:#bcd; font-size:0.95rem; line-height:1.6; }
  .play { display:inline-block; margin-top:14px; padding:10px 28px; background:#f39c3c; color:#221;
          border-radius:999px; font-weight:bold; }
  footer { color:#678; font-size:0.8rem; padding:24px 0 40px; }
</style>
</head>
<body>
<header>
  <h1>⭐ ヒトデゲームセンター</h1>
  <p class="sub">ヒトデが作ったゲームを集めた場所だよ</p>
</header>

<a class="card" href="/hitode-game-center/shooting/">
  <div class="title">🛸 ヒトデシューティング</div>
  <div class="desc">縦スクロールシューティング。ステージは自動生成で無限、5面ごとにボス戦。指の相対ドラッグ／マウス／矢印キーで移動、弾は自動発射。</div>
  <span class="play">▶ 遊ぶ</span>
</a>

<a class="card" href="/hitode-game-center/tetris/">
  <div class="title">🧩 ヒトデテトリス</div>
  <div class="desc">落ちものパズル。ライン消去の演出とBGMで、やってて楽しいやつ。タップ／スワイプ／画面ボタンで操作、ホールドとハードドロップ対応。</div>
  <span class="play">▶ 遊ぶ</span>
</a>

<footer>Hitode Game Center ・ <a href="privacy.html" style="color:#9ab">プライバシーポリシー</a></footer>
</body>
</html>
